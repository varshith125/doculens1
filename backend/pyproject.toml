[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "doculens"
version = "1.0.0"
description = "Local, evidence-based passport and identity document scanner"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3", "numpy>=2,<3", "opencv-python-headless>=4.11,<5",
  "Pillow>=11,<13", "rapidocr[rtl]==3.10.0", "onnxruntime>=1.20,<2", "PyYAML>=6,<7",
  "pycountry>=24.6,<25", "RapidFuzz>=3.10,<4", "pypdfium2>=4.30,<6",
  "tokenizers>=0.21,<1", "lingua-language-detector>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "psutil>=7,<8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real OCR inference; requires installed models"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
